services:
  postgres:
    image: postgres:16-alpine
    container_name: mandate_mesh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mandate_user
      POSTGRES_PASSWORD: mandate_password
      POSTGRES_DB: mandate_mesh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandate_user -d mandate_mesh"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
